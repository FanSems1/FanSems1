<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Petal Quest — Samuel Sukarno</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080716;color:#fff;font-family:Inter,system-ui,sans-serif}body{display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#4c285d 0,transparent 38%),#080716}#game{position:relative;width:min(1100px,100vw);height:min(650px,100vh);overflow:hidden;border:1px solid #d8b4fe55;box-shadow:0 30px 90px #000;border-radius:24px;background:url('../assets/samuel-anime-world.png') center/cover}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#0a0817aa,#0a081722 48%,#070817aa)}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;inset:24px 28px auto;display:flex;justify-content:space-between;align-items:start;pointer-events:none;text-shadow:0 2px 8px #000}.title{font-family:Georgia,serif;font-size:clamp(24px,4vw,44px)}.sub{font:11px monospace;letter-spacing:3px;color:#fbcfe8}.stats{text-align:right;font:700 14px monospace;line-height:1.8}.panel{position:absolute;inset:0;display:grid;place-items:center;background:#07081788;backdrop-filter:blur(5px);text-align:center;padding:24px}.card{padding:30px 38px;border:1px solid #f0abfc88;border-radius:20px;background:#0b0a1ddd;box-shadow:0 0 45px #d946ef33}.card h1{font:700 clamp(32px,6vw,60px) Georgia,serif;margin:0 0 8px}.card p{color:#ddd6fe;max-width:520px}.card button{border:0;border-radius:999px;padding:13px 28px;background:linear-gradient(90deg,#f9a8d4,#a5b4fc,#67e8f9);color:#181125;font-weight:900;letter-spacing:2px;cursor:pointer;box-shadow:0 0 25px #e879f955}.help{position:absolute;bottom:18px;width:100%;text-align:center;font:10px monospace;letter-spacing:2px;color:#e9d5ff;pointer-events:none}@media(max-width:600px){#game{height:100vh;border-radius:0}.hud{inset:16px}.sub{letter-spacing:1px}}
  </style>
</head>
<body>
  <main id="game"><div class="veil"></div><canvas id="canvas"></canvas>
    <div class="hud"><div><div class="sub">FANSEMS1 // MINI GAME</div><div class="title">Petal Quest</div></div><div class="stats">SCORE <span id="score">000</span><br>TIME <span id="time">30</span></div></div>
    <div class="help">MOVE: ← → / A D / TOUCH &nbsp; • &nbsp; CATCH THE GLOWING PETALS</div>
    <div class="panel" id="panel"><div class="card"><div class="sub">A TINY GAME BY SAMUEL SUKARNO</div><h1>Petal Quest</h1><p>Catch as many celestial petals as you can before the memory fades.</p><button id="start">START JOURNEY</button></div></div>
  </main>
  <script>
    const c=document.querySelector('#canvas'),x=c.getContext('2d'),game=document.querySelector('#game'),panel=document.querySelector('#panel'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time');let W,H,player,petals,score,time,run,last,keys={};
    function resize(){W=c.width=game.clientWidth*devicePixelRatio;H=c.height=game.clientHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=game.clientWidth;H=game.clientHeight;if(player)player.y=H-75}addEventListener('resize',resize);resize();
    function reset(){player={x:W/2,y:H-75,w:92,h:18};petals=[];score=0;time=30;run=true;last=performance.now();scoreEl.textContent='000';timeEl.textContent='30';panel.style.display='none';requestAnimationFrame(loop)}
    function spawn(){petals.push({x:30+Math.random()*(W-60),y:-20,r:7+Math.random()*5,v:1.6+Math.random()*2.2,a:Math.random()*6.28,s:Math.random()>.18})}
    function loop(now){if(!run)return;let dt=Math.min((now-last)/16.67,2);last=now;if(Math.random()<.055*dt)spawn();if(keys.ArrowLeft||keys.a)player.x-=7*dt;if(keys.ArrowRight||keys.d)player.x+=7*dt;player.x=Math.max(player.w/2,Math.min(W-player.w/2,player.x));time-=dt/60;if(time<=0){run=false;panel.style.display='grid';panel.querySelector('h1').textContent=`Score ${score}`;panel.querySelector('p').textContent=score>14?'Legendary run! The garden remembers you.':'The petals are waiting for another journey.';document.querySelector('#start').textContent='PLAY AGAIN';return}timeEl.textContent=Math.ceil(time);x.clearRect(0,0,W,H);x.save();x.shadowBlur=22;x.shadowColor='#f9a8d4';x.fillStyle='#fce7f3';petals.forEach((p,i)=>{p.y+=p.v*dt;p.a+=.04*dt;p.x+=Math.sin(p.a)*.7;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.beginPath();x.ellipse(0,0,p.r*.55,p.r,0,0,7);x.fillStyle=p.s?'#fbcfe8':'#a5f3fc';x.fill();x.restore();if(p.y>player.y-14&&p.y<player.y+18&&Math.abs(p.x-player.x)<player.w/2){petals.splice(i,1);score++;scoreEl.textContent=String(score).padStart(3,'0')}else if(p.y>H+20)petals.splice(i,1)});x.restore();let g=x.createLinearGradient(player.x-player.w/2,0,player.x+player.w/2,0);g.addColorStop(0,'#f9a8d4');g.addColorStop(.5,'#ddd6fe');g.addColorStop(1,'#67e8f9');x.shadowBlur=24;x.shadowColor='#c084fc';x.fillStyle=g;x.beginPath();x.roundRect(player.x-player.w/2,player.y,player.w,player.h,9);x.fill();x.shadowBlur=0;requestAnimationFrame(loop)}
    addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);game.addEventListener('pointermove',e=>{if(!run)return;let r=game.getBoundingClientRect();player.x=(e.clientX-r.left)/r.width*W});document.querySelector('#start').onclick=reset;
  </script>
</body>
</html>
