<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Samuel Sukarno — Front-End Engineer</title>
  <desc id="desc">Animated futuristic portfolio interface for Samuel Sukarno, a Front-End Engineer in Jakarta.</desc>
  <defs>
    <linearGradient id="back" x1="45" y1="15" x2="1140" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#050816"/><stop offset=".5" stop-color="#0A1024"/><stop offset="1" stop-color="#07131D"/></linearGradient>
    <linearGradient id="neon" x1="250" y1="100" x2="970" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#8B5CF6"><animate attributeName="stop-color" values="#8B5CF6;#EC4899;#06B6D4;#8B5CF6" dur="8s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#EC4899"><animate attributeName="stop-color" values="#EC4899;#06B6D4;#8B5CF6;#EC4899" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#8B5CF6;#EC4899;#22D3EE" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
    <radialGradient id="orbA"><stop stop-color="#8B5CF6" stop-opacity=".38"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop stop-color="#06B6D4" stop-opacity=".28"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".8"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="window"><rect x="44" y="38" width="1112" height="404" rx="25"/></clipPath>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Monaco,monospace}.blink{animation:blink 1s steps(2,end) infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.dash{stroke-dasharray:7 10;animation:dash 8s linear infinite}.trace{stroke-dasharray:290;stroke-dashoffset:290;animation:trace 4s ease-in-out infinite}.spin{transform-origin:center;animation:spin 18s linear infinite}.spinback{transform-origin:center;animation:spin 13s linear reverse infinite}
      @keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.3}}@keyframes dash{to{stroke-dashoffset:-136}}@keyframes trace{40%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-290}}@keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </defs>
  <rect width="1200" height="480" rx="30" fill="url(#back)"/>
  <circle cx="170" cy="100" r="240" fill="url(#orbA)" filter="url(#blur)" class="pulse"/><circle cx="1050" cy="410" r="260" fill="url(#orbB)" filter="url(#blur)" class="pulse"/>
  <g opacity=".1" stroke="#64748B"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/><path d="M80 0V480M160 0V480M240 0V480M320 0V480M400 0V480M480 0V480M560 0V480M640 0V480M720 0V480M800 0V480M880 0V480M960 0V480M1040 0V480M1120 0V480"/></g>
  <g filter="url(#shadow)"><rect x="24" y="18" width="1152" height="444" rx="32" fill="#070B16" stroke="url(#neon)" stroke-opacity=".75"/><rect x="44" y="38" width="1112" height="404" rx="25" fill="#0B1120"/></g>
  <g clip-path="url(#window)">
    <rect x="44" y="38" width="1112" height="50" fill="#111827"/><circle cx="71" cy="63" r="6" fill="#FB7185"/><circle cx="92" cy="63" r="6" fill="#FBBF24"/><circle cx="113" cy="63" r="6" fill="#34D399"/><rect x="156" y="51" width="390" height="25" rx="12.5" fill="#070B16" stroke="#1E293B"/><circle cx="176" cy="63.5" r="4" fill="#34D399"/><text x="189" y="68" class="mono" font-size="11" fill="#94A3B8">FanSems1.dev / portfolio</text><text x="1100" y="68" class="mono" font-size="11" fill="#475569">•••</text>
    <g transform="translate(75 120)">
      <rect width="638" height="266" rx="22" fill="#0D1527" stroke="#243147"/>
      <text x="28" y="34" class="mono" font-size="10" font-weight="700" letter-spacing="2" fill="#A78BFA">WELCOME_TO_MY_WORLD.TSX</text>
      <text x="28" y="77" class="sans" font-size="17" font-weight="700" fill="#22D3EE">HELLO, I'M</text>
      <text x="27" y="130" class="sans" font-size="47" font-weight="800" fill="#F8FAFC">Samuel Sukarno</text>
      <rect x="29" y="145" width="430" height="4" rx="2" fill="url(#neon)"><animate attributeName="width" values="0;430;430" keyTimes="0;.55;1" dur="3.8s" repeatCount="indefinite"/></rect>
      <text x="28" y="185" class="mono" font-size="21" fill="#CBD5E1">Front-End Engineer</text><rect x="253" y="165" width="10" height="25" rx="2" fill="#EC4899" class="blink"/>
      <text x="28" y="219" class="sans" font-size="13" fill="#64748B">I turn complex ideas into interfaces people love to use.</text>
      <g transform="translate(28 238)"><circle cx="6" cy="6" r="4" fill="#34D399"/><circle cx="6" cy="6" r="9" fill="none" stroke="#34D399" opacity=".35" class="pulse"/><text x="20" y="10" class="mono" font-size="11" fill="#94A3B8">Jakarta, Indonesia</text><text x="160" y="10" class="mono" font-size="11" fill="#475569">•</text><text x="177" y="10" class="mono" font-size="11" fill="#94A3B8">Open to collaboration</text></g>
    </g>
    <g transform="translate(746 111)">
      <rect width="378" height="284" rx="24" fill="#0D1527" stroke="#243147"/>
      <text x="25" y="34" class="mono" font-size="10" letter-spacing="2" fill="#64748B">CREATIVE_CORE // ONLINE</text><circle cx="346" cy="29" r="5" fill="#34D399" filter="url(#glow)"/>
      <g transform="translate(189 139)"><circle r="73" fill="none" stroke="#1E293B"/><circle r="73" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="7 10" class="spin"/><circle r="50" fill="#0B1120" stroke="#334155"/><path d="M-17-8L-29 0-17 8M17-8L29 0 17 8M7-20L-6 20" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <g class="spinback"><circle cx="0" cy="-94" r="11" fill="#111827" stroke="#8B5CF6"/><text x="0" y="-90" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#DDD6FE">JS</text><circle cx="81" cy="47" r="11" fill="#111827" stroke="#22D3EE"/><text x="81" y="51" text-anchor="middle" class="sans" font-size="8" font-weight="700" fill="#CFFAFE">UI</text><circle cx="-81" cy="47" r="11" fill="#111827" stroke="#EC4899"/><text x="-81" y="51" text-anchor="middle" class="sans" font-size="8" font-weight="700" fill="#FCE7F3">UX</text></g>
      </g>
      <path d="M24 238C65 222 87 251 126 232S184 250 223 226 290 249 352 219" stroke="url(#neon)" stroke-width="2" fill="none" class="trace" filter="url(#glow)"/>
      <g transform="translate(24 254)"><rect width="330" height="12" rx="6" fill="#111827"/><rect width="302" height="12" rx="6" fill="url(#neon)"><animate attributeName="width" values="10;302;302" keyTimes="0;.7;1" dur="4s" repeatCount="indefinite"/></rect></g>
    </g>
    <path d="M715 105V407" stroke="#334155" stroke-dasharray="7 10" class="dash"/>
    <g transform="translate(92 407)"><text class="mono" font-size="10" fill="#475569">01</text><text x="30" class="mono" font-size="10" fill="#A78BFA">design</text><text x="78" class="mono" font-size="10" fill="#475569">→</text><text x="95" class="mono" font-size="10" fill="#22D3EE">develop</text><text x="150" class="mono" font-size="10" fill="#475569">→</text><text x="167" class="mono" font-size="10" fill="#EC4899">delight</text></g>
  </g>
  <rect x="1" y="1" width="1198" height="478" rx="29" stroke="url(#neon)" stroke-opacity=".35"/>
</svg>
