<svg width="1200" height="570" viewBox="0 0 1200 570" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
 <title id="title">Samuel Sukarno — Anime Handheld Console</title>
 <desc id="desc">A modern animated handheld game console showing an original fantasy anime heroine and Samuel's developer save profile.</desc>
 <defs>
  <linearGradient id="shell" x1="65" y1="40" x2="1135" y2="530"><stop stop-color="#F8F4FF"/><stop offset=".42" stop-color="#DCD7F8"/><stop offset="1" stop-color="#A9C8EB"/></linearGradient>
  <linearGradient id="edge" x1="120" y1="60" x2="1080" y2="530"><stop stop-color="#FFB8DA"><animate attributeName="stop-color" values="#FFB8DA;#B9A7FF;#9CEBFF;#FFB8DA" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#8DDFFF"><animate attributeName="stop-color" values="#8DDFFF;#FFB8DA;#B9A7FF;#8DDFFF" dur="7s" repeatCount="indefinite"/></stop></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#7C6FAD" stop-opacity=".12"/></linearGradient>
  <radialGradient id="shine"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dy="22" stdDeviation="22" flood-color="#291A48" flood-opacity=".48"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
  <clipPath id="screen"><rect x="222" y="99" width="756" height="372" rx="24"/></clipPath>
  <style>
   .ui{font-family:Inter,Segoe UI,Arial,sans-serif}.serif{font-family:Georgia,Times New Roman,serif}.mono{font-family:Consolas,monospace}.pulse{animation:pulse 2.5s ease-in-out infinite}.blink{animation:blink 1.1s steps(2) infinite}.float{animation:float 4s ease-in-out infinite}.spin{transform-origin:center;animation:spin 16s linear infinite}.shimmer{animation:shimmer 4s linear infinite}.press{animation:press 3s ease-in-out infinite}
   @keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shimmer{from{transform:translateX(-400px)}to{transform:translateX(900px)}}@keyframes press{50%{transform:scale(.92)}}
  </style>
 </defs>
 <rect width="1200" height="570" rx="32" fill="#090817"/><circle cx="180" cy="120" r="160" fill="#D67DE8" opacity=".12" filter="url(#soft)"/><circle cx="1050" cy="450" r="190" fill="#62D9FF" opacity=".12" filter="url(#soft)"/>
 <g opacity=".14" fill="#D8D0FF"><circle cx="62" cy="74" r="2"/><circle cx="1120" cy="70" r="2"/><circle cx="72" cy="470" r="2"/><circle cx="1115" cy="500" r="2"/><path d="M107 120l3 8 8 3-8 3-3 8-3-8-8-3 8-3zM1082 180l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></g>
 <!-- console body -->
 <g filter="url(#shadow)"><path d="M86 87C95 42 132 22 177 30L1023 30C1068 22 1105 42 1114 87L1160 474C1167 527 1118 551 1076 523L1005 477H195L124 523C82 551 33 527 40 474Z" fill="url(#shell)" stroke="url(#edge)" stroke-width="3"/><path d="M102 94C109 60 134 48 170 52H1030C1066 48 1091 60 1098 94" stroke="white" stroke-opacity=".72" stroke-width="3"/></g>
 <rect x="202" y="79" width="796" height="412" rx="34" fill="#161329" stroke="#6F6A92" stroke-width="3"/><rect x="214" y="91" width="772" height="388" rx="27" fill="#05040B"/>
 <!-- artwork screen -->
 <g clip-path="url(#screen)"><image href="./samuel-anime-world.png" x="222" y="99" width="756" height="372" preserveAspectRatio="xMidYMid slice"/>
  <rect x="222" y="99" width="756" height="372" fill="url(#glass)" opacity=".28"/>
  <path d="M222 420C420 362 512 453 720 397S900 379 978 343V471H222Z" fill="#070717" opacity=".28"/>
  <!-- game save UI -->
  <g transform="translate(665 139)"><animateTransform attributeName="transform" type="translate" values="665 139;665 132;665 139" dur="4s" repeatCount="indefinite"/><rect width="278" height="245" rx="18" fill="#09091A" fill-opacity=".68" stroke="#F5D0FE" stroke-opacity=".58"/><path d="M18 20H63M215 20H260M18 225H63M215 225H260" stroke="url(#edge)"/>
   <text x="139" y="39" text-anchor="middle" class="mono" font-size="9" letter-spacing="3" fill="#FBCFE8">SAVE DATA 01</text>
   <text x="139" y="79" text-anchor="middle" class="serif" font-size="25" font-weight="700" fill="white">Samuel Sukarno</text>
   <text x="139" y="103" text-anchor="middle" class="mono" font-size="10" letter-spacing="2" fill="#A5F3FC">FRONT-END ENGINEER</text>
   <line x1="30" y1="121" x2="248" y2="121" stroke="#fff" stroke-opacity=".2"/>
   <text x="31" y="144" class="mono" font-size="9" fill="#D8B4FE">PLAYER</text><text x="247" y="144" text-anchor="end" class="mono" font-size="9" fill="white">@FanSems1</text>
   <text x="31" y="166" class="mono" font-size="9" fill="#D8B4FE">REGION</text><text x="247" y="166" text-anchor="end" class="mono" font-size="9" fill="white">JAKARTA</text>
   <text x="31" y="188" class="mono" font-size="9" fill="#D8B4FE">STATUS</text><circle cx="196" cy="184" r="4" fill="#6EE7B7" filter="url(#glow)"/><text x="247" y="188" text-anchor="end" class="mono" font-size="9" fill="#6EE7B7">ONLINE</text>
   <rect x="30" y="204" width="218" height="27" rx="13.5" fill="url(#edge)"/><text x="139" y="222" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#171125">▶ CONTINUE</text><rect x="23" y="197" width="232" height="41" rx="20" fill="none" stroke="#fff" opacity=".35" class="pulse"/>
  </g>
  <g class="shimmer"><path d="M-180 75L-80 75 180 495H80Z" fill="white" opacity=".07"/></g>
 </g>
 <!-- left controls -->
 <g><circle cx="125" cy="188" r="55" fill="#C6C3E1" stroke="#9994BD" stroke-width="3"/><circle cx="125" cy="188" r="39" fill="#706B91"/><circle cx="125" cy="188" r="31" fill="#8B86A8" stroke="#BEBADD"/><ellipse cx="113" cy="176" rx="11" ry="7" fill="white" opacity=".18"/>
 <g transform="translate(125 325)"><circle r="57" fill="#CAC7E4" stroke="#9994BD" stroke-width="3"/><path d="M-12-39H12V-12H39V12H12V39H-12V12H-39V-12H-12Z" fill="#686382"/><circle r="10" fill="#77718F"/></g>
 <rect x="90" y="416" width="70" height="8" rx="4" fill="#A7A3C5"/><rect x="106" y="428" width="38" height="8" rx="4" fill="#A7A3C5"/></g>
 <!-- right controls -->
 <g transform="translate(1071 205)"><circle r="77" fill="#C9C5E4" stroke="#9994BD" stroke-width="3"/>
  <g class="press"><circle cy="-43" r="24" fill="#F1A7C8" stroke="#B875A0"/><text y="-38" text-anchor="middle" class="ui" font-size="14" font-weight="700" fill="white">Y</text></g>
  <circle cx="43" r="24" fill="#8EDCF2" stroke="#5AA9C5"/><text x="43" y="5" text-anchor="middle" class="ui" font-size="14" font-weight="700" fill="white">A</text>
  <circle cy="43" r="24" fill="#B5A5ED" stroke="#8070BE"/><text y="48" text-anchor="middle" class="ui" font-size="14" font-weight="700" fill="white">X</text>
  <circle cx="-43" r="24" fill="#F5CE82" stroke="#C29B52"/><text x="-43" y="5" text-anchor="middle" class="ui" font-size="14" font-weight="700" fill="white">B</text></g>
 <g transform="translate(1070 347)"><circle r="43" fill="#C6C3E1" stroke="#9994BD" stroke-width="3"/><circle r="29" fill="#716C91"/><circle r="21" fill="#8B86A8"/></g>
 <!-- speaker + brand -->
 <g fill="#817C9F"><circle cx="1036" cy="424" r="3"/><circle cx="1050" cy="420" r="3"/><circle cx="1064" cy="416" r="3"/><circle cx="1078" cy="412" r="3"/><circle cx="1050" cy="434" r="3"/><circle cx="1064" cy="430" r="3"/><circle cx="1078" cy="426" r="3"/><circle cx="1092" cy="422" r="3"/></g>
 <text x="600" y="518" text-anchor="middle" class="serif" font-size="14" font-style="italic" letter-spacing="4" fill="#8A84AA">DREAMLINK</text><circle cx="600" cy="542" r="4" fill="#77E6D1" filter="url(#glow)" class="blink"/>
 <path d="M314 52H457M743 52H886" stroke="url(#edge)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" class="pulse"/>
</svg>
