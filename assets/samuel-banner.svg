<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
 <title id="title">Samuel Sukarno — JRPG Character Reveal</title>
 <desc id="desc">A cinematic anime game character splash screen introducing Samuel Sukarno, Front-End Engineer from Jakarta.</desc>
 <defs>
  <linearGradient id="fade" x1="1200" y1="260" x2="460" y2="260"><stop stop-color="#070817" stop-opacity=".98"/><stop offset=".55" stop-color="#0B0A1D" stop-opacity=".78"/><stop offset="1" stop-color="#111229" stop-opacity="0"/></linearGradient>
  <linearGradient id="bottom" x1="600" y1="520" x2="600" y2="265"><stop stop-color="#070817" stop-opacity=".96"/><stop offset="1" stop-color="#070817" stop-opacity="0"/></linearGradient>
  <linearGradient id="magic" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB7DC"><animate attributeName="stop-color" values="#FFB7DC;#B8A6FF;#8EEAFF;#FFB7DC" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#8EEAFF"><animate attributeName="stop-color" values="#8EEAFF;#FFB7DC;#B8A6FF;#8EEAFF" dur="7s" repeatCount="indefinite"/></stop></linearGradient>
  <radialGradient id="halo"><stop stop-color="#F0ABFC" stop-opacity=".42"/><stop offset="1" stop-color="#F0ABFC" stop-opacity="0"/></radialGradient>
  <pattern id="stars" width="90" height="70" patternUnits="userSpaceOnUse"><circle cx="11" cy="18" r="1" fill="white" opacity=".35"/><circle cx="63" cy="49" r=".7" fill="#BAE6FD" opacity=".5"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feDropShadow dy="7" stdDeviation="7" flood-color="#020617" flood-opacity=".85"/></filter>
  <clipPath id="frame"><path d="M24 61L63 22H1137L1176 61V459L1137 498H63L24 459Z"/></clipPath>
  <style>
   .ui{font-family:Inter,Segoe UI,Arial,sans-serif}.serif{font-family:Georgia,Times New Roman,serif}.mono{font-family:Consolas,monospace}.pulse{animation:pulse 2.4s ease-in-out infinite}.blink{animation:blink 1.1s steps(2) infinite}.float{animation:float 4s ease-in-out infinite}.spin{transform-origin:center;animation:spin 18s linear infinite}.dash{stroke-dasharray:8 13;animation:dash 7s linear infinite}.reveal{animation:reveal 5s ease-in-out infinite}.drift1{animation:drift1 7s linear infinite}.drift2{animation:drift2 9s linear infinite}
   @keyframes pulse{50%{opacity:.3}}@keyframes blink{50%{opacity:0}}@keyframes float{50%{transform:translateY(-6px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-168}}@keyframes reveal{0%,12%{opacity:0;transform:translateX(25px)}28%,88%{opacity:1;transform:translateX(0)}100%{opacity:0}}@keyframes drift1{from{transform:translate(0,-40px) rotate(0)}to{transform:translate(90px,520px) rotate(240deg)}}@keyframes drift2{from{transform:translate(0,-80px) rotate(0)}to{transform:translate(-100px,540px) rotate(-260deg)}}
  </style>
 </defs>
 <rect width="1200" height="520" rx="28" fill="#070817"/>
 <g clip-path="url(#frame)">
  <image href="./samuel-anime-world.png" width="1200" height="520" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="520" fill="url(#stars)"/>
  <rect x="430" width="770" height="520" fill="url(#fade)"/><rect y="260" width="1200" height="260" fill="url(#bottom)"/>
  <circle cx="347" cy="227" r="190" fill="url(#halo)" class="pulse"/>
  <!-- celestial rings behind character -->
  <g transform="translate(346 230)" opacity=".55"><ellipse rx="185" ry="185" stroke="url(#magic)" stroke-width="1.5" stroke-dasharray="8 13" class="spin"/><ellipse rx="155" ry="78" stroke="#FBCFE8" transform="rotate(-18)" class="dash"/><path d="M0-207L6-190 24-184 6-177 0-160-6-177-24-184-6-190Z" fill="#FFF7FC" filter="url(#glow)"/></g>
  <!-- reveal info -->
  <g transform="translate(675 92)" class="reveal">
   <text class="mono" font-size="10" letter-spacing="4" fill="#F9A8D4">NEW CHARACTER ACQUIRED</text>
   <g transform="translate(0 30)" fill="#FFE5A3" filter="url(#glow)"><path d="M8 0l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path transform="translate(23)" d="M8 0l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path transform="translate(46)" d="M8 0l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path transform="translate(69)" d="M8 0l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path transform="translate(92)" d="M8 0l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></g>
   <text y="103" class="serif" font-size="52" font-weight="700" fill="white" filter="url(#shadow)">Samuel Sukarno</text>
   <rect y="119" width="418" height="3" rx="1.5" fill="#334155"/><rect y="119" width="315" height="3" rx="1.5" fill="url(#magic)"><animate attributeName="width" values="0;315;315" keyTimes="0;.65;1" dur="4s" repeatCount="indefinite"/></rect>
   <text y="151" class="mono" font-size="13" letter-spacing="3" fill="#BAE6FD">FRONT-END ENGINEER</text>
   <g transform="translate(0 184)"><path d="M23 0L46 13V39L23 52 0 39V13Z" fill="#17182E" stroke="url(#magic)"/><path d="M14 27L21 34 34 18" stroke="#A5F3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="20" class="mono" font-size="9" fill="#94A3B8">PATH</text><text x="64" y="40" class="ui" font-size="15" font-weight="700" fill="#F8FAFC">The Architect</text></g>
   <g transform="translate(225 184)"><circle cx="25" cy="26" r="25" fill="#17182E" stroke="#F9A8D4"/><path d="M25 10C31 18 38 21 38 29A13 13 0 0 1 12 29C12 21 19 18 25 10Z" fill="url(#magic)"/><text x="62" y="20" class="mono" font-size="9" fill="#94A3B8">REGION</text><text x="62" y="40" class="ui" font-size="15" font-weight="700" fill="#F8FAFC">Jakarta</text></g>
   <text y="279" class="serif" font-size="15" font-style="italic" fill="#CBD5E1">“Turning complex ideas into experiences people love.”</text>
   <g transform="translate(0 313)"><path d="M0 24H418" stroke="url(#magic)" opacity=".5"/><circle cx="15" cy="24" r="5" fill="#6EE7B7" filter="url(#glow)"/><text x="31" y="28" class="mono" font-size="10" letter-spacing="2" fill="#E2E8F0">PROFILE DATA // SYNCHRONIZED</text></g>
  </g>
  <!-- drifting petals -->
  <g fill="#FFD6EA"><ellipse cx="120" cy="-20" rx="5" ry="11" class="drift1"/><ellipse cx="480" cy="-60" rx="4" ry="9" class="drift2"/><ellipse cx="845" cy="-35" rx="5" ry="10" class="drift1" style="animation-delay:-3s"/><ellipse cx="1080" cy="-10" rx="4" ry="9" class="drift2" style="animation-delay:-5s"/></g>
 </g>
 <!-- ornate game frame -->
 <path d="M24 61L63 22H1137L1176 61V459L1137 498H63L24 459Z" stroke="url(#magic)" stroke-width="2"/>
 <path d="M24 127V61L63 22H145M1055 22H1137L1176 61V127M24 393V459L63 498H145M1055 498H1137L1176 459V393" stroke="url(#magic)" stroke-width="5" filter="url(#glow)"/>
 <g transform="translate(600 22)"><path d="M0-13L10 0 0 13-10 0Z" fill="url(#magic)" filter="url(#glow)"/><path d="M-92 0H-17M17 0H92" stroke="url(#magic)"/></g>
 <text x="61" y="474" class="mono" font-size="9" letter-spacing="2" fill="#E9D5FF">@FANSEMS1</text><text x="1139" y="474" text-anchor="end" class="mono" font-size="9" letter-spacing="2" fill="#BAE6FD">STATUS // ONLINE</text>
</svg>
