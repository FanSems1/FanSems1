<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
 <title id="title">Samuel Sukarno — Front-End Engineer Player Card</title>
 <desc id="desc">Animated cyberpunk game HUD showing Samuel Sukarno as a level 24 Front-End Engineer from Jakarta.</desc>
 <defs>
  <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="480"><stop stop-color="#05040D"/><stop offset=".48" stop-color="#0A0920"/><stop offset="1" stop-color="#03131B"/></linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF2BD6"><animate attributeName="stop-color" values="#FF2BD6;#7C3AED;#00E5FF;#FF2BD6" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#00E5FF"><animate attributeName="stop-color" values="#00E5FF;#FF2BD6;#7C3AED;#00E5FF" dur="7s" repeatCount="indefinite"/></stop></linearGradient>
  <linearGradient id="hp"><stop stop-color="#00F5A0"/><stop offset="1" stop-color="#00D9F5"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#7C3AED" stop-opacity=".35"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6366F1" stroke-opacity=".11"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H1200" stroke="#fff" stroke-opacity=".025"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".85"/></filter>
  <clipPath id="avatar"><path d="M89 112L120 82H295L326 112V327L295 357H120L89 327Z"/></clipPath>
  <style>
   .ui{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Monaco,monospace}.pulse{animation:pulse 2s ease-in-out infinite}.blink{animation:blink 1s steps(2) infinite}.spin{transform-origin:center;animation:spin 12s linear infinite}.spinback{transform-origin:center;animation:spin 8s linear reverse infinite}.dash{stroke-dasharray:8 12;animation:dash 6s linear infinite}.scan{animation:scanner 4s linear infinite}.flicker{animation:flicker 5s linear infinite}
   @keyframes pulse{50%{opacity:.3}}@keyframes blink{50%{opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-160}}@keyframes scanner{from{transform:translateY(-120px)}to{transform:translateY(300px)}}@keyframes flicker{0%,18%,22%,100%{opacity:1}20%{opacity:.45}21%{opacity:.1}}
  </style>
 </defs>
 <rect width="1200" height="500" rx="28" fill="url(#bg)"/><rect width="1200" height="500" rx="28" fill="url(#grid)"/>
 <circle cx="207" cy="238" r="230" fill="url(#halo)" class="pulse"/><circle cx="1030" cy="80" r="180" fill="#00E5FF" opacity=".05"/>
 <g filter="url(#shadow)"><path d="M28 68L68 28H1132L1172 68V432L1132 472H68L28 432Z" fill="#070817" fill-opacity=".92" stroke="url(#hot)"/><path d="M45 80L80 45H1120L1155 80V420L1120 455H80L45 420Z" stroke="#273559"/></g>
 <path d="M28 118V68L68 28H198M1002 28H1132L1172 68V118M28 382V432L68 472H198M1002 472H1132L1172 432V382" stroke="url(#hot)" stroke-width="4" filter="url(#glow)"/>
 <g class="mono" font-size="10"><text x="75" y="74" fill="#00E5FF">PLAYER_DATABASE // ID: F4N-S3MS-01</text><text x="944" y="74" fill="#64748B">SERVER</text><circle cx="1005" cy="70" r="4" fill="#00F5A0" filter="url(#glow)"/><text x="1016" y="74" fill="#00F5A0">ONLINE</text></g>
 <!-- player portrait -->
 <g>
  <path d="M76 102L112 66H303L339 102V337L303 373H112L76 337Z" fill="#0B1024" stroke="#334155"/>
  <g clip-path="url(#avatar)"><rect x="89" y="82" width="237" height="275" fill="#080D1C"/><circle cx="208" cy="215" r="105" fill="url(#halo)"/>
   <path d="M165 205L178 162L208 145L239 162L251 205L238 252L208 272L177 252Z" fill="#151D38" stroke="#00E5FF" stroke-width="2"/>
   <path d="M178 162L208 145L239 162L230 180H187Z" fill="#7C3AED" opacity=".55"/><path d="M187 204L199 195H217L229 204L218 213H198Z" fill="#020617" stroke="#FF2BD6" filter="url(#glow)"/>
   <path d="M183 252L134 283L114 357H302L282 283L233 252L208 287Z" fill="#111A33" stroke="#7C3AED" stroke-width="2"/><path d="M183 252L208 287L233 252" stroke="#00E5FF" stroke-width="3"/>
   <g class="scan"><rect x="89" y="80" width="237" height="2" fill="#00E5FF" filter="url(#glow)"/><rect x="89" y="82" width="237" height="30" fill="url(#hot)" opacity=".08"/></g>
  </g>
  <path d="M76 155V102L112 66H164M251 66H303L339 102V155M76 284V337L112 373H164M251 373H303L339 337V284" stroke="url(#hot)" stroke-width="3"/>
  <rect x="100" y="330" width="217" height="25" rx="4" fill="#050816" stroke="#263450"/><text x="111" y="347" class="mono" font-size="10" fill="#64748B">CLASS</text><text x="164" y="347" class="mono" font-size="10" font-weight="700" fill="#00E5FF">FRONT-END ENGINEER</text>
 </g>
 <!-- identity -->
 <g transform="translate(378 107)">
  <text class="mono" font-size="11" letter-spacing="3" fill="#FF2BD6">LEGENDARY DEVELOPER</text>
  <text y="50" class="ui flicker" font-size="45" font-weight="800" fill="#F8FAFC">SAMUEL SUKARNO</text>
  <rect y="64" width="550" height="3" fill="#1E293B"/><rect y="64" width="410" height="3" fill="url(#hot)" filter="url(#glow)"><animate attributeName="width" values="0;410;410" keyTimes="0;.65;1" dur="3.5s" repeatCount="indefinite"/></rect>
  <g transform="translate(0 88)"><rect width="74" height="28" rx="5" fill="#7C3AED"/><text x="37" y="19" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="white">LVL 24</text><text x="91" y="19" class="mono" font-size="11" fill="#94A3B8">@FanSems1</text><text x="220" y="19" class="mono" font-size="11" fill="#475569">//</text><text x="247" y="19" class="mono" font-size="11" fill="#94A3B8">JAKARTA SECTOR</text></g>
  <g transform="translate(0 140)"><text class="mono" font-size="10" fill="#64748B">XP</text><rect x="30" y="-9" width="520" height="12" rx="6" fill="#111827"/><rect x="30" y="-9" width="438" height="12" rx="6" fill="url(#hot)"><animate attributeName="width" values="10;438;438" keyTimes="0;.7;1" dur="4s" repeatCount="indefinite"/></rect><text x="480" y="24" class="mono" font-size="9" fill="#64748B">8,420 / 10,000</text></g>
  <g transform="translate(0 185)">
   <text class="mono" font-size="10" letter-spacing="2" fill="#64748B">ACTIVE QUEST</text><rect y="14" width="550" height="77" rx="9" fill="#0B1224" stroke="#25324B"/>
   <path d="M17 31H28V42" stroke="#00E5FF"/><text x="43" y="42" class="ui" font-size="14" font-weight="700" fill="#E2E8F0">CRAFT THE IMPOSSIBLE UI</text><text x="43" y="64" class="mono" font-size="10" fill="#64748B">Turn complex ideas into interfaces people love to use.</text><circle cx="516" cy="51" r="12" fill="none" stroke="#00F5A0"/><path d="M510 51L515 56L523 46" stroke="#00F5A0" stroke-width="2"/>
  </g>
 </g>
 <!-- radar -->
 <g transform="translate(1017 206)"><circle r="90" fill="#080E20" stroke="#263450"/><circle r="67" fill="none" stroke="#273559"/><circle r="42" fill="none" stroke="#273559"/><path d="M-90 0H90M0-90V90" stroke="#273559"/><g class="spin"><path d="M0 0L72-53A90 90 0 0 1 90 0Z" fill="url(#hot)" opacity=".18"/><path d="M0 0L72-53" stroke="#00E5FF" filter="url(#glow)"/></g><circle cx="36" cy="-29" r="4" fill="#FF2BD6" filter="url(#glow)" class="pulse"/><circle cx="-48" cy="35" r="4" fill="#00E5FF" filter="url(#glow)" class="pulse"/><text y="116" text-anchor="middle" class="mono" font-size="9" fill="#64748B">OPPORTUNITY RADAR</text></g>
 <!-- loadout -->
 <g transform="translate(378 408)"><text class="mono" font-size="9" letter-spacing="2" fill="#64748B">SKILL LOADOUT</text>
  <g transform="translate(111 -19)"><g><rect width="62" height="62" rx="10" fill="#11152B" stroke="#7C3AED"/><text x="31" y="39" text-anchor="middle" class="ui" font-size="22" font-weight="800" fill="#C4B5FD">JS</text><text x="31" y="75" text-anchor="middle" class="mono" font-size="8" fill="#64748B">JAVASCRIPT</text></g>
  <g transform="translate(82)"><rect width="62" height="62" rx="10" fill="#11152B" stroke="#00E5FF"/><text x="31" y="39" text-anchor="middle" class="ui" font-size="19" font-weight="800" fill="#A5F3FC">TS</text><text x="31" y="75" text-anchor="middle" class="mono" font-size="8" fill="#64748B">TYPESCRIPT</text></g>
  <g transform="translate(164)"><rect width="62" height="62" rx="10" fill="#11152B" stroke="#38BDF8"/><text x="31" y="39" text-anchor="middle" class="ui" font-size="18" font-weight="800" fill="#BAE6FD">⚛</text><text x="31" y="75" text-anchor="middle" class="mono" font-size="8" fill="#64748B">REACT</text></g>
  <g transform="translate(246)"><rect width="62" height="62" rx="10" fill="#11152B" stroke="#FF2BD6"/><text x="31" y="39" text-anchor="middle" class="ui" font-size="18" font-weight="800" fill="#FBCFE8">UI</text><text x="31" y="75" text-anchor="middle" class="mono" font-size="8" fill="#64748B">DESIGN</text></g></g>
 </g>
 <path d="M357 94V392" stroke="#334155" class="dash"/><rect width="1200" height="500" rx="28" fill="url(#scan)" pointer-events="none"/>
 <text x="83" y="435" class="mono" font-size="10" fill="#64748B">STATUS</text><circle cx="134" cy="431" r="4" fill="#00F5A0"/><text x="145" y="435" class="mono" font-size="10" fill="#00F5A0">READY FOR CO-OP</text>
</svg>
