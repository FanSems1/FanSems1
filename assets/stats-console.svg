<svg width="1000" height="180" viewBox="0 0 1000 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
 <title id="title">Samuel's animated celestial activity console</title>
 <desc id="desc">A pastel fantasy game interface with animated stars, activity bars, and profile synchronization status.</desc>
 <defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171329"/><stop offset="1" stop-color="#0D0B1F"/></linearGradient>
  <linearGradient id="magic" x1="110" y1="20" x2="890" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#F9A8D4"><animate attributeName="stop-color" values="#F9A8D4;#C4B5FD;#A5F3FC;#F9A8D4" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#A5F3FC"><animate attributeName="stop-color" values="#A5F3FC;#F9A8D4;#C4B5FD;#A5F3FC" dur="7s" repeatCount="indefinite"/></stop></linearGradient>
  <radialGradient id="orb"><stop stop-color="#F9A8D4" stop-opacity=".35"/><stop offset="1" stop-color="#F9A8D4" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="stars" width="70" height="45" patternUnits="userSpaceOnUse"><circle cx="8" cy="12" r="1" fill="#fff" opacity=".18"/><circle cx="48" cy="34" r=".8" fill="#A5F3FC" opacity=".25"/></pattern>
  <style>.ui{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.spin{transform-origin:center;animation:spin 12s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.dash{stroke-dasharray:6 9;animation:dash 5s linear infinite}.float{animation:float 3.5s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.3}}@keyframes dash{to{stroke-dashoffset:-90}}@keyframes float{50%{transform:translateY(-4px)}}</style>
 </defs>
 <rect width="1000" height="180" rx="22" fill="#080716"/>
 <path d="M22 44L50 16H950L978 44V136L950 164H50L22 136Z" fill="url(#panel)" stroke="url(#magic)"/>
 <path d="M22 70V44L50 16H115M885 16H950L978 44V70M22 110V136L50 164H115M885 164H950L978 136V110" stroke="url(#magic)" stroke-width="3" filter="url(#glow)"/>
 <path d="M44 30H956V150H44Z" fill="url(#stars)"/>
 <circle cx="115" cy="90" r="72" fill="url(#orb)" class="pulse"/>
 <g transform="translate(115 90)"><circle r="47" fill="#0D0B1F" stroke="#332B52"/><circle r="37" fill="none" stroke="url(#magic)" stroke-width="2" stroke-dasharray="5 8" class="spin"/><path d="M0-24L6-7 24 0 6 7 0 24-6 7-24 0-6-7Z" fill="url(#magic)" filter="url(#glow)"/><circle cy="-37" r="3" fill="#fff" class="pulse"/></g>
 <g transform="translate(200 50)"><text class="mono" font-size="9" letter-spacing="3" fill="#F9A8D4">CELESTIAL ACTIVITY CONSOLE</text><text y="34" class="ui" font-size="21" font-weight="700" fill="#F8FAFC">GitHub Constellation Sync</text><text y="57" class="mono" font-size="9" fill="#A8A1C0">Mapping commits, streaks, and new discoveries...</text><circle cx="5" cy="82" r="4" fill="#6EE7B7" filter="url(#glow)"/><text x="17" y="86" class="mono" font-size="9" letter-spacing="2" fill="#6EE7B7">PROFILE ONLINE</text></g>
 <g transform="translate(585 47)"><text class="mono" font-size="8" letter-spacing="2" fill="#A8A1C0">ACTIVITY SIGNAL</text>
  <g transform="translate(0 18)" fill="url(#magic)"><rect width="10" height="48" rx="5"><animate attributeName="height" values="18;48;27;18" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="30;0;21;30" dur="2.2s" repeatCount="indefinite"/></rect><rect x="20" y="10" width="10" height="38" rx="5"><animate attributeName="height" values="38;20;46;38" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="10;28;2;10" dur="2.6s" repeatCount="indefinite"/></rect><rect x="40" y="20" width="10" height="28" rx="5"><animate attributeName="height" values="28;45;16;28" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="20;3;32;20" dur="2.1s" repeatCount="indefinite"/></rect><rect x="60" y="5" width="10" height="43" rx="5"><animate attributeName="height" values="43;22;48;43" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="5;26;0;5" dur="2.8s" repeatCount="indefinite"/></rect><rect x="80" y="15" width="10" height="33" rx="5"><animate attributeName="height" values="33;48;24;33" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="15;0;24;15" dur="2.4s" repeatCount="indefinite"/></rect></g>
  <text y="89" class="mono" font-size="8" fill="#A5F3FC">LIVE // RECEIVING</text></g>
 <g transform="translate(760 90)"><path d="M0 0C28-38 61 37 92-6S146 30 183-12" stroke="url(#magic)" stroke-width="2" fill="none" class="dash" filter="url(#glow)"/><circle cx="92" cy="-6" r="4" fill="#F9A8D4" class="pulse"/><circle cx="183" cy="-12" r="4" fill="#A5F3FC" class="pulse"/><text x="0" y="43" class="mono" font-size="8" letter-spacing="2" fill="#A8A1C0">JOURNEY IN PROGRESS</text></g>
 <g transform="translate(500 16)"><path d="M0-8L7 0 0 8-7 0Z" fill="url(#magic)" filter="url(#glow)"/><path d="M-60 0H-12M12 0H60" stroke="url(#magic)"/></g>
</svg>
